[project]
name = "mini-agent-backend"
version = "0.2.0"
description = "Minimal, production-minded agent runtime with SSE and SQLite"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6.0.2,<7",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.17,<1",
  "python-dotenv>=1.0,<2",
  "pillow>=11,<12",
  "pypdf>=5,<6",
  "pathspec>=0.12,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "asgi-lifespan>=2.1,<3",
  "ruff>=0.8,<1",
  "coverage[toml]>=7.6,<8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "E501", "ASYNC109", "ASYNC240"]

[tool.coverage.run]
source = ["mini_agent"]
