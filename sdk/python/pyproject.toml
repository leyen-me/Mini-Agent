[project]
name = "mini-agent-sdk"
version = "0.2.0"
description = "Python client for the Mini Agent HTTP API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_agent_sdk"]
