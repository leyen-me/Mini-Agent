name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - name: Install
        run: cd backend && uv sync --all-groups
      - name: Lint and format
        run: |
          cd backend
          uv run ruff check mini_agent tests
          uv run ruff format --check mini_agent tests
      - name: Test
        run: cd backend && uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Typecheck, lint, test, build
        run: |
          cd frontend
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build


  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: |
          cd backend && uv sync --all-groups
          cd ../frontend && pnpm install --frozen-lockfile
      - name: Install Chromium
        run: cd frontend && pnpm exec playwright install --with-deps chromium
      - name: Playwright
        run: cd frontend && pnpm e2e
